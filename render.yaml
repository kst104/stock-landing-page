services:
  - type: web
    name: stock-landing-page
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: KIS_KEY
        sync: false
      - key: KIS_SECRET
        sync: false
      - key: AUTH_ADMIN_EMAIL
        value: promokorea@gmail.com
      - key: AUTH_ADMIN_PASSWORD
        sync: false
